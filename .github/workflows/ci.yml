name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: agent/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: test
        run: go test -race -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: coverage
        run: go tool cover -func=coverage.out | tail -n 1
      - run: go build -o fimagent ./cmd/fimagent

  demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: agent/go.sum
      - name: end-to-end demo
        run: bash examples/demo/run_demo.sh

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: validate docker compose file
        run: docker compose -f docker/docker-compose.yml config --quiet
      - name: build agent image
        run: docker build -f docker/agent.Dockerfile -t fimagent .
